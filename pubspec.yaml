name: thesis_track
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0
  sqflite: ^2.4.4+1
  path: ^1.9.1
  provider: ^6.1.5+1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: 0.20.2
  connectivity_plus: ^7.3.2
  table_calendar: 3.2.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F4F7F5"
    theme_color: "#176B63"
